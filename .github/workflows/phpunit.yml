name: PHPUnit

on:
  pull_request:
    paths:
      - 'wordpress-sandbox/wp-content/plugins/wp-search/**'
  push:
    branches:
      - main
    paths:
      - 'wordpress-sandbox/wp-content/plugins/wp-search/**'

jobs:
  phpunit:
    name: Run wp-search unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wordpress-sandbox/wp-content/plugins/wp-search

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, xml, tokenizer, ctype
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPUnit
        run: vendor/bin/phpunit
